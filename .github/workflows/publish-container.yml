name: CI and Multi-Arch Container

on:
    push:
        branches:
            - main
        tags:
            - "v*"
    pull_request:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: container-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    backend:
        name: Backend tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Test all Go packages
              run: go test ./...

    frontend:
        name: Frontend checks
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Type check
              run: npx vue-tsc --noEmit

            - name: Lint
              run: npx eslint .

            - name: Test
              run: npm test

            - name: Build production frontend
              run: npm run build

    container:
        name: Publish linux/amd64 + linux/arm64
        if: github.event_name != 'pull_request'
        needs:
            - backend
            - frontend
        uses: docker/github-builder/.github/workflows/build.yml@v1
        permissions:
            contents: read
            packages: write
            id-token: write
            attestations: write
        with:
            output: image
            push: true
            platforms: linux/amd64,linux/arm64
            context: .
            file: ./Dockerfile
            build-args: |
                RELEASE_BUILD=1
                BUILD_PIPELINE=1
                BUILD_NO_TESTS=1
                BUILD_COMMIT_HASH=${{ github.sha }}
            cache: true
            cache-mode: max
            cache-scope: ezbookkeeping-pixel
            sbom: true
            sign: auto
            set-meta-labels: true
            set-meta-annotations: true
            meta-images: ghcr.io/panda-995/ezbookkeeping-pixel
            meta-tags: |
                type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
                type=ref,event=tag
                type=sha,prefix=sha-
            meta-labels: |
                org.opencontainers.image.title=ezBookkeeping Pixel
                org.opencontainers.image.description=Pixel-style ezBookkeeping refactor with complete authenticated MCP and Agent financial mutations
                org.opencontainers.image.licenses=MIT
                org.opencontainers.image.source=https://github.com/Panda-995/ezbookkeeping-pixel
        secrets:
            registry-auths: |
                - registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
